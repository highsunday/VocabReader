name: Release desktop installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            script: dist:mac:arm64
            bundle: macos-arm64
            artifact: apps/desktop/release/VocabReader-*-mac-arm64.dmg
          - label: macOS Intel
            runner: macos-15-intel
            script: dist:mac:x64
            bundle: macos-x64
            artifact: apps/desktop/release/VocabReader-*-mac-x64.dmg
          - label: Windows x64
            runner: windows-latest
            script: dist:win:x64
            bundle: windows-x64
            artifact: apps/desktop/release/VocabReader-*-windows-x64-setup.exe
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify desktop types
        run: npm run typecheck -w @reader/desktop

      - name: Verify release configuration
        run: npm run test:release -w @reader/desktop

      - name: Build installer
        run: npm run ${{ matrix.script }} -w @reader/desktop

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.bundle }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v6

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/release-notes/${tag}.md"
          if [[ ! -f "$notes" ]]; then
            notes="docs/release-notes/unsigned-preview.md"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --verify-tag \
              --title "VocabReader ${tag}" \
              --notes-file "$notes"
          fi
