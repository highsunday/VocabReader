<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Codex AI 對話範例</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <p class="eyebrow">MINIMUM RUNNABLE EXAMPLE</p>
          <h1>Codex AI 對話</h1>
        </div>
        <div class="status-cluster">
          <div id="connection" class="connection" aria-live="polite">尚未連線</div>
          <section id="allowance" class="allowance" aria-label="AI 使用額度">
            <span class="allowance-window">
              <span>5h</span>
              <strong id="allowance-five-hour">…</strong>
            </span>
            <span class="allowance-window">
              <span>週</span>
              <strong id="allowance-weekly">…</strong>
            </span>
            <button id="refresh-allowance" class="text-button" type="button" title="重新整理 AI 使用額度" aria-label="重新整理 AI 使用額度">↻</button>
          </section>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div class="empty-state">
          <h2>從一個問題開始</h2>
          <p>此範例使用本機 Codex 登入狀態，對話只保留到程式關閉為止。</p>
        </div>
      </section>

      <form id="composer" class="composer">
        <label for="question">傳送給 Codex</label>
        <textarea id="question" rows="3" placeholder="例如：請用簡單英文說明這個句子的文法。" required></textarea>
        <p id="settings-detail" class="settings-detail" role="status"></p>

        <div id="settings-popover" class="settings-popover" role="dialog" aria-label="對話設定" hidden>
          <section class="settings-group" aria-labelledby="model-heading">
            <h2 id="model-heading">對話模型</h2>
            <div id="model-options" class="settings-options" role="radiogroup" aria-label="對話模型"></div>
          </section>
          <section class="settings-group" aria-labelledby="effort-heading">
            <h2 id="effort-heading">推理強度</h2>
            <div id="effort-options" class="settings-options" role="radiogroup" aria-label="推理強度"></div>
          </section>
        </div>

        <div class="actions">
          <span id="hint" role="status"></span>
          <div class="composer-controls">
            <button
              id="settings-trigger"
              class="settings-trigger"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="settings-popover"
              disabled
            >
              <span id="settings-summary">模型設定</span>
              <span class="settings-chevron" aria-hidden="true">⌄</span>
            </button>
            <button id="send" type="submit">傳送</button>
          </div>
        </div>
      </form>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
